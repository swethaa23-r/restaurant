<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Page Not Found | Stackly Premium Restaurant</title>
    <meta name="description" content="Page not found - Stackly Premium Restaurant.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: { 50: '#fdf8f6', 100: '#f2e8e5', 200: '#eaddd7', 300: '#e0cec7', 400: '#d2bab0', 500: '#a37a6b', 600: '#8c6052', 700: '#6b473a', 800: '#4a2f26', 900: '#271712' } },
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
                }
            }
        }
    </script>
    <style>
        html, body {  overflow-x: hidden;  max-width: 100%;}
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Playfair Display', serif; }
        
        /* Navbar Transitions */
        .nav-scrolled { background-color: rgba(255, 255, 255, 0.98) !important; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); py: 1rem !important; }
        .nav-scrolled .nav-link { color: #4a5568 !important; }
        .nav-scrolled .nav-link:hover { color: #8c6052 !important; }
        .nav-scrolled .logo-text { color: #271712 !important; }
        .nav-scrolled .mobile-btn { color: #271712 !important; }
        
        /* Mobile Menu */
        .mobile-menu { transition: transform 0.4s ease-in-out; }
        .mobile-menu-closed { transform: translateX(100%); }
        
        /* 404 Animations & Styles */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        @keyframes pulse-glow {
            0% { text-shadow: 0 0 20px rgba(210, 186, 176, 0.2); }
            50% { text-shadow: 0 0 40px rgba(210, 186, 176, 0.6); }
            100% { text-shadow: 0 0 20px rgba(210, 186, 176, 0.2); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-glow { animation: pulse-glow 4s ease-in-out infinite; }
        
        /* Buttons */
        .btn-primary { background-color: #8c6052; color: white; transition: background-color 0.3s, transform 0.2s; }
        .btn-primary:hover { background-color: #6b473a; transform: translateY(-2px); }
        .btn-outline-white { border: 1px solid rgba(255,255,255,0.4); color: white; transition: all 0.3s, transform 0.2s; }
        .btn-outline-white:hover { border-color: white; background-color: rgba(255,255,255,0.1); transform: translateY(-2px); }
    </style>
</head>
<body class="bg-gray-900 flex flex-col min-h-screen overflow-hidden">
<div id="page-wrapper" class="overflow-x-hidden w-full relative">

    <!-- Navbar (Transparent to keep the immersive 404 experience) -->
    <header id="navbar" class="fixed w-full z-50 transition-all duration-300 py-4 bg-white shadow-md">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <a href="index.html" class="text-3xl font-serif font-bold logo-text text-gray-900 transition-colors duration-300"><img src="logo.webp" alt="Stackly Logo" class="h-7 sm:h-8 sm:h-10 w-auto inline brightness-0 max-w-[180px] sm:max-w-[220px] object-contain"></a>
            
            <!-- Desktop Nav -->
            <nav class="hidden md:flex items-center space-x-8">
                <a href="index.html" class="nav-link text-gray-900/80 font-medium hover:text-gray-900 transition-colors">Home</a>
                <a href="menu.html" class="nav-link text-gray-900/80 font-medium hover:text-gray-900 transition-colors">Menu</a>
                <a href="reservations.html" class="btn-primary px-7 py-2.5 rounded-full font-medium shadow-lg hover:shadow-xl">Book a Table</a>
            </nav>

            <!-- Mobile Toggle -->
            <button id="mobile-toggle" class="md:hidden mobile-btn text-gray-900 text-2xl focus:outline-none transition-colors">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- Mobile Menu Overlay -->
    <div id="mobile-menu" class="fixed inset-0 bg-white z-[60] mobile-menu mobile-menu-closed flex flex-col shadow-2xl">
        <div class="flex justify-between items-center p-6 border-b">
            <span><img src="logo.webp" alt="Stackly Logo" class="h-7 sm:h-8 w-auto inline brightness-0 max-w-[180px] sm:max-w-[220px] object-contain"></span>
            <button id="mobile-close" class="text-2xl text-gray-600 focus:outline-none"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="flex flex-col p-6 space-y-6 text-xl text-center overflow-y-auto pb-20">
            <a href="index.html" class="font-medium text-gray-600 hover:text-primary-600">Home</a>
            <a href="about.html" class="font-medium text-gray-600 hover:text-primary-600">About</a>
            <a href="menu.html" class="font-medium text-gray-600 hover:text-primary-600">Menu</a>
            <hr class="border-gray-100">
            <a href="reservations.html" class="btn-primary py-4 rounded-full font-medium inline-block w-full">Book a Table</a>
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center relative min-h-screen">
        
        <!-- Background Image with Overlay -->
        <div class="absolute inset-0 z-0">
            <!-- A subtle, moody restaurant interior to fit the "lost" theme -->
            <img src="img/atmosphere.webp" alt="Empty Dining Room" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gray-900/85 backdrop-blur-[2px]"></div>
        </div>

        <div class="relative z-10 text-center px-6 w-full max-w-2xl mx-auto">
            
            <!-- Large Floating 404 Animation -->
            <div class="mb-4" data-aos="fade-down" data-aos-duration="1000">
                <h1 class="text-[8rem] sm:text-[12rem] md:text-[16rem] leading-none font-serif font-bold text-primary-400 opacity-90 animate-float animate-glow select-none">404</h1>
            </div>
            
            <div data-aos="fade-up" data-aos-delay="200">
                <h2 class="text-3xl md:text-4xl sm:text-5xl font-serif font-bold text-white mb-6">Page Not Found</h2>
                <div class="w-20 h-1 bg-primary-600 mx-auto mb-6"></div>
                
                <p class="text-gray-300 text-lg md:text-xl mb-12 font-light leading-relaxed">
                    It seems this table hasn't been set. The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
                </p>
                
                <!-- Buttons -->
                <div class="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-6 justify-center">
                    <button onclick="window.history.back()" class="btn-outline-white px-8 py-4 rounded-full font-bold text-sm tracking-wide uppercase flex items-center justify-center w-full sm:w-auto">
                        <i class="fa-solid fa-arrow-left mr-3"></i> Go Back
                    </button>
                    <a href="index.html" class="btn-primary px-8 py-4 rounded-full font-bold text-sm tracking-wide uppercase flex items-center justify-center w-full sm:w-auto shadow-[0_0_20px_rgba(140,96,82,0.4)]">
                        Return Home <i class="fa-solid fa-house ml-3"></i>
                    </a>
                </div>
            </div>
            
        </div>
        
    </main>

    <!-- Scripts -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Initialize AOS animations
        AOS.init({ 
            duration: 900, 
            once: true,
            easing: 'ease-out-cubic'
        });
        
        // Mobile Menu Functionality
        const mobileToggle = document.getElementById('mobile-toggle');
        const mobileClose = document.getElementById('mobile-close');
        const mobileMenu = document.getElementById('mobile-menu');
        
        
        const mobileMenuContent = document.getElementById('mobile-menu-content');
        if(mobileToggle && mobileMenu && mobileMenuContent) {
            mobileToggle.addEventListener('click', () => {
                mobileMenu.classList.remove('hidden');
                setTimeout(() => {
                    mobileMenu.classList.remove('opacity-0');
                    mobileMenuContent.classList.remove('translate-x-full');
                    document.body.style.overflow = 'hidden';
                }, 10);
            });
        }
        
        if(mobileClose && mobileMenu && mobileMenuContent) {
            mobileClose.addEventListener('click', () => {
                mobileMenu.classList.add('opacity-0');
                mobileMenuContent.classList.add('translate-x-full');
                document.body.style.overflow = '';
                setTimeout(() => {
                    mobileMenu.classList.add('hidden');
                }, 300);
            });
        }

        // Check session to update nav
        document.addEventListener('DOMContentLoaded', () => {
            const session = localStorage.getItem('stackly_session');
            const loginBtn = document.getElementById('nav-login-btn');
            const mobLoginBtn = document.getElementById('mobile-nav-login');
            
            if(session) {
                const user = JSON.parse(session);
                const dashLink = user.role === 'admin' ? 'admin.html' : 'dashboard.html';
                
                if(loginBtn) {
                    loginBtn.innerText = 'Dashboard';
                    loginBtn.href = dashLink;
                }
                
            }
            
            // Close mobile menu on link click
            const mobileLinks = document.querySelectorAll('.mobile-nav-link');
            mobileLinks.forEach(link => {
                link.addEventListener('click', () => {
                    if(typeof closeMenu === 'function') closeMenu();
                });
            });
        });
    
    </script>
</div>
</body>
</html>
